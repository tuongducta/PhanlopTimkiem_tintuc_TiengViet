# Giao diện tối theo template sources/template_demo/ (nền obsidian, điểm nhấn cyan/indigo).
# Streamlit đọc file này khi chạy từ thư mục gốc dự án.
[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#07090E"
secondaryBackgroundColor = "#111622"
textColor = "#CBD5E1"
borderColor = "#1E293B"
baseRadius = "12px"

[theme.sidebar]
backgroundColor = "#0C0F17"
secondaryBackgroundColor = "#111622"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
