name: check
on: [push, pull_request]
jobs:
  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chặn commit file .env
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "Phát hiện .env trong repo!"; exit 1; fi
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kiểm tra cú pháp Python
        run: python -m py_compile $(git ls-files 'src/*.py' 'livrables/*.py')
